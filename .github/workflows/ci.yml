name: CI

# Phase 0 support/characterization matrix. Later remediation phases add their
# behavioral regressions to these existing jobs; this file must not encode
# expected future fixes as if they already worked.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-full:
    name: linux-full / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install strict runtime dependencies
        run: python -m pip install --quiet 'jsonschema[format]' PyYAML ./reference/python

      - name: Validate capability contract
        run: python tests/capability_contract_test.py

      - name: Run strict regression suite
        env:
          STRICT_XPASS: '1'
        run: bash tests/run.sh

  linux-minimal-deps:
    name: linux-minimal-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Deliberately install no optional Python packages here. Phase 0 proves
      # the declared contract and source syntax; the F-07 fail-closed runtime
      # regression is added in its owning phase.
      - name: Validate capability contract without optional dependencies
        run: python tests/capability_contract_test.py

      - name: Compile Python sources
        run: python -m py_compile tools/*.py

      - name: Check Bash syntax
        run: bash -n tools/scoutica

  macos-bash32:
    name: macos-bash32
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require system Bash 3.2
        run: |
          /bin/bash --version | head -n 1
          test "$(/bin/bash -c 'printf "%s.%s" "$BASH_VERSINFO" "${BASH_VERSINFO[1]}"')" = '3.2'

      - name: Validate capability contract
        run: python tests/capability_contract_test.py

      - name: Install strict runtime dependencies
        run: python -m pip install --quiet 'jsonschema[format]' PyYAML ./reference/python

      - name: Run strict regression suite with system Bash
        env:
          STRICT_XPASS: '1'
        run: /bin/bash tests/run.sh

  windows-powershell-51:
    name: windows-powershell-51
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require Windows PowerShell 5.1
        run: |
          $version = $PSVersionTable.PSVersion
          Write-Host "Windows PowerShell $version"
          if ($version.Major -ne 5 -or $version.Minor -ne 1) { throw "Expected Windows PowerShell 5.1" }

      - name: Validate capability contract
        run: python tests/capability_contract_test.py

      - name: Install strict runtime dependencies
        run: python -m pip install --quiet 'jsonschema[format]' PyYAML

      - name: Parse Windows PowerShell sources
        run: |
          foreach ($script in @('tools/scoutica.ps1', 'install.ps1', 'tests/windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }

      - name: Run clean-install Windows subset regressions
        run: .\tests\windows.ps1

  windows-powershell-7:
    name: windows-powershell-7
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require PowerShell 7
        run: |
          $version = $PSVersionTable.PSVersion
          Write-Host "PowerShell $version"
          if ($version.Major -ne 7) { throw "Expected PowerShell 7" }

      - name: Validate capability contract
        run: python tests/capability_contract_test.py

      - name: Install strict runtime dependencies
        run: python -m pip install --quiet 'jsonschema[format]' PyYAML

      - name: Parse PowerShell sources
        run: |
          foreach ($script in @('tools/scoutica.ps1', 'install.ps1', 'tests/windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }

      - name: Run clean-install Windows subset regressions
        run: .\tests\windows.ps1

  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build

      - name: Check documentation links
        run: npm run check:links

      - name: Check active documentation claims
        run: npm run check:claims
